<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We're Getting Married!</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Georgia', serif; /* Classic wedding font */
            background-color: #fcfbf9; /* Soft off-white */
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            padding: 2rem;
            max-width: 600px;
        }

        h1 {
            font-size: 3rem;
            font-weight: normal;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: normal;
            color: #666;
            margin-bottom: 2rem;
            font-style: italic;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 3rem;
        }

        .rsvp-button {
            display: inline-block;
            background-color: #4a6c6f; /* Elegant muted teal/green */
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            font-size: 1.2rem;
            border-radius: 4px;
            letter-spacing: 1px;
            transition: background-color 0.3s ease;
        }

        .rsvp-button:hover {
            background-color: #3a5457;
        }

        /* Optional: Add a subtle floral or decorative border */
        .decoration {
            font-size: 2rem;
            color: #d4c4a8; /* Gold/sand color */
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="decoration">❦</div>
        <h1>Partner 1 & Partner 2</h1>
        <h2>Are Tying the Knot!</h2>
        
        <p>We are so excited to celebrate our special day with you.<br>
        Please visit our full wedding website for all the details, accommodations, and to RSVP.</p>

        <!-- Replace the href below with your actual Zola link -->
        <a href="https://www.zola.com/wedding/your-zola-url" class="rsvp-button" target="_blank" rel="noopener noreferrer">
            Go to Wedding Website & RSVP
        </a>
    </div>

</body>
</html>
