<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 380 380" class="w-full h-full drop-shadow-2xl overflow-visible">
<style>
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    @keyframes spin-slow-reverse { 100% { transform: rotate(-360deg); } }
    /* Using 150px 150px ensures it spins exactly around the center of our geometry */
    .animate-spin-slow { animation: spin-slow 40s linear infinite; transform-origin: 150px 150px; }
    .animate-spin-reverse { animation: spin-slow-reverse 30s linear infinite; transform-origin: 150px 150px; }
</style>

    <!-- Outer Kolam / Rangoli Ring -->
    <g class="animate-spin-slow" style="transform-origin: 150px 150px;">
        
        <!-- 12 Outer Petals (Loops) Filled with Deep Maroon and Gold borders -->
        <g stroke="#D4AF37" stroke-width="4" fill="#73000A">
            <defs>
                <path id="rangoli-petal" d="M 150 20 C 180 5, 195 -30, 150 -30 C 105 -30, 120 5, 150 20 Z" />
            </defs>
            <use href="#rangoli-petal" transform="rotate(0 150 150)" />
            <use href="#rangoli-petal" transform="rotate(30 150 150)" />
            <use href="#rangoli-petal" transform="rotate(60 150 150)" />
            <use href="#rangoli-petal" transform="rotate(90 150 150)" />
            <use href="#rangoli-petal" transform="rotate(120 150 150)" />
            <use href="#rangoli-petal" transform="rotate(150 150 150)" />
            <use href="#rangoli-petal" transform="rotate(180 150 150)" />
            <use href="#rangoli-petal" transform="rotate(210 150 150)" />
            <use href="#rangoli-petal" transform="rotate(240 150 150)" />
            <use href="#rangoli-petal" transform="rotate(270 150 150)" />
            <use href="#rangoli-petal" transform="rotate(300 150 150)" />
            <use href="#rangoli-petal" transform="rotate(330 150 150)" />
        </g>
        
        <!-- Kolam Interlocking Squares Filled with vibrant Saffron -->
        <g stroke="#73000A" stroke-width="3" fill="#FF9933" fill-opacity="0.8">
            <rect x="45" y="45" width="210" height="210" transform="rotate(15 150 150)" />
            <rect x="45" y="45" width="210" height="210" transform="rotate(45 150 150)" />
            <rect x="45" y="45" width="210" height="210" transform="rotate(75 150 150)" />
        </g>

        <!-- Rangoli Dots: A pop of contrasting authentic green -->
        <g fill="#2E8B57">
            <circle cx="285.0" cy="150.0" r="6" />
            <circle cx="280.4" cy="184.9" r="6" />
            <circle cx="266.9" cy="217.5" r="6" />
            <circle cx="245.5" cy="245.5" r="6" />
            <circle cx="217.5" cy="266.9" r="6" />
            <circle cx="184.9" cy="280.4" r="6" />
            <circle cx="150.0" cy="285.0" r="6" />
            <circle cx="115.1" cy="280.4" r="6" />
            <circle cx="82.5" cy="266.9" r="6" />
            <circle cx="54.5" cy="245.5" r="6" />
            <circle cx="33.1" cy="217.5" r="6" />
            <circle cx="19.6" cy="184.9" r="6" />
            <circle cx="15.0" cy="150.0" r="6" />
            <circle cx="19.6" cy="115.1" r="6" />
            <circle cx="33.1" cy="82.5" r="6" />
            <circle cx="54.5" cy="54.5" r="6" />
            <circle cx="82.5" cy="33.1" r="6" />
            <circle cx="115.1" cy="19.6" r="6" />
            <circle cx="150.0" cy="15.0" r="6" />
            <circle cx="184.9" cy="19.6" r="6" />
            <circle cx="217.5" cy="33.1" r="6" />
            <circle cx="245.5" cy="54.5" r="6" />
            <circle cx="266.9" cy="82.5" r="6" />
            <circle cx="280.4" cy="115.1" r="6" />
        </g>
    </g>
    
    <!-- Inner Rangoli Ring -->
    <g class="animate-spin-reverse" style="transform-origin: 150px 150px;">
        <!-- Solid inner base circle to ground the colors -->
        <circle cx="150" cy="150" r="90" fill="#5C3A21" stroke="#D4AF37" stroke-width="4" />
        
        <!-- 8 Pointed Star / Petals inside -->
        <g stroke="#D4AF37" stroke-width="2">
            <defs>
                <!-- Vibrant Rani Pink for authentic contrast -->
                <path id="inner-petal" d="M 150 60 Q 170 100, 150 150 Q 130 100, 150 60 Z" fill="#E91E63" />
            </defs>
            <use href="#inner-petal" transform="rotate(0 150 150)" />
            <use href="#inner-petal" transform="rotate(45 150 150)" />
            <use href="#inner-petal" transform="rotate(90 150 150)" />
            <use href="#inner-petal" transform="rotate(135 150 150)" />
            <use href="#inner-petal" transform="rotate(180 150 150)" />
            <use href="#inner-petal" transform="rotate(225 150 150)" />
            <use href="#inner-petal" transform="rotate(270 150 150)" />
            <use href="#inner-petal" transform="rotate(315 150 150)" />
        </g>
        
        <!-- Central white/cream circle to frame the Texas star -->
        <circle cx="150" cy="150" r="60" fill="#FDFBF7" stroke="#D4AF37" stroke-width="4" stroke-dasharray="6, 6" />
    </g>

    <!-- Central Static Lone Star (Texas) -->
    <!-- Matches the exact points from the original so it fits perfectly -->
    <g>
        <polygon points="150,95 163,130 200,130 170,152 182,190 150,168 118,190 130,152 100,130 137,130" fill="#BF5700" />
        <polygon points="150,110 157,135 180,135 162,150 168,175 150,160 132,175 138,150 120,135 143,135" fill="#FF9933" opacity="0.8"/>
    </g>
</svg>