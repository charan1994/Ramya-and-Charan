<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" class="w-full h-full drop-shadow-2xl overflow-visible">
<style>
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    @keyframes spin-slow-reverse { 100% { transform: rotate(-360deg); } }
    .animate-spin-slow { animation: spin-slow 35s linear infinite; transform-origin: center; }
    .animate-spin-reverse { animation: spin-slow-reverse 25s linear infinite; transform-origin: center; }
</style>

    <!-- Outer Kolam / Rangoli Ring -->
    <g class="animate-spin-slow">
        <!-- Base Rings -->
        <circle cx="150" cy="150" r="130" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="10, 5" />
        <circle cx="150" cy="150" r="115" fill="none" stroke="#FF9933" stroke-width="4" stroke-dasharray="0, 15" stroke-linecap="round" />
        
        <!-- 12 Outer Petals (Loops) -->
        <g stroke="#73000A" stroke-width="3" fill="none">
            <defs>
                <path id="rangoli-petal" d="M 150 20 C 170 20, 185 -10, 150 -10 C 115 -10, 130 20, 150 20 Z" />
            </defs>
            <use href="#rangoli-petal" transform="rotate(0 150 150)" />
            <use href="#rangoli-petal" transform="rotate(30 150 150)" />
            <use href="#rangoli-petal" transform="rotate(60 150 150)" />
            <use href="#rangoli-petal" transform="rotate(90 150 150)" />
            <use href="#rangoli-petal" transform="rotate(120 150 150)" />
            <use href="#rangoli-petal" transform="rotate(150 150 150)" />
            <use href="#rangoli-petal" transform="rotate(180 150 150)" />
            <use href="#rangoli-petal" transform="rotate(210 150 150)" />
            <use href="#rangoli-petal" transform="rotate(240 150 150)" />
            <use href="#rangoli-petal" transform="rotate(270 150 150)" />
            <use href="#rangoli-petal" transform="rotate(300 150 150)" />
            <use href="#rangoli-petal" transform="rotate(330 150 150)" />
        </g>
        
        <!-- Kolam Interlocking Squares -->
        <rect x="65" y="65" width="170" height="170" fill="none" stroke="#D4AF37" stroke-width="2" transform="rotate(15 150 150)" />
        <rect x="65" y="65" width="170" height="170" fill="none" stroke="#D4AF37" stroke-width="2" transform="rotate(45 150 150)" />
        <rect x="65" y="65" width="170" height="170" fill="none" stroke="#D4AF37" stroke-width="2" transform="rotate(75 150 150)" />
    </g>
    
    <!-- Inner Rangoli Ring -->
    <g class="animate-spin-reverse">
        <circle cx="150" cy="150" r="75" fill="none" stroke="#73000A" stroke-width="2" />
        <!-- 8 Pointed Star / Petals inside -->
        <defs>
            <path id="inner-petal" d="M 150 75 Q 165 110, 150 150 Q 135 110, 150 75 Z" fill="#FF9933" opacity="0.6"/>
        </defs>
        <use href="#inner-petal" transform="rotate(0 150 150)" />
        <use href="#inner-petal" transform="rotate(45 150 150)" />
        <use href="#inner-petal" transform="rotate(90 150 150)" />
        <use href="#inner-petal" transform="rotate(135 150 150)" />
        <use href="#inner-petal" transform="rotate(180 150 150)" />
        <use href="#inner-petal" transform="rotate(225 150 150)" />
        <use href="#inner-petal" transform="rotate(270 150 150)" />
        <use href="#inner-petal" transform="rotate(315 150 150)" />
        
        <circle cx="150" cy="150" r="65" fill="#FDFBF7" stroke="#D4AF37" stroke-width="3" stroke-dasharray="4, 4" />
    </g>

    <!-- Central Static Lone Star (Texas) -->
    <g>
        <polygon points="150,95 163,130 200,130 170,152 182,190 150,168 118,190 130,152 100,130 137,130" fill="#BF5700" />
        <polygon points="150,110 157,135 180,135 162,150 168,175 150,160 132,175 138,150 120,135 143,135" fill="#FF9933" opacity="0.8"/>
    </g>
</svg>