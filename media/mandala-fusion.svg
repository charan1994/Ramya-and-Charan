<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" class="w-full h-full drop-shadow-2xl overflow-visible">
<style>
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    @keyframes spin-slow-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 5px rgba(212,175,55,0.4)); } 50% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.8)); } }
    .animate-spin-slow { animation: spin-slow 24s linear infinite; transform-origin: center; }
    .animate-spin-reverse { animation: spin-slow-reverse 30s linear infinite; transform-origin: center; }
    .animate-pulse-glow { animation: pulse-glow 4s ease-in-out infinite; }
</style>

                    
                    <!-- Outer Rotating Mandala (Karnataka) -->
                    <g class="animate-spin-slow">
                        <circle cx="150" cy="150" r="120" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6, 12" />
                        <circle cx="150" cy="150" r="110" fill="none" stroke="#73000A" stroke-width="4" stroke-dasharray="20, 10, 5, 10" />
                        <circle cx="150" cy="150" r="95" fill="none" stroke="#FF9933" stroke-width="1" />
                        <!-- Mandala Petals -->
                        <path d="M 150 30 C 160 50, 170 50, 150 70 C 130 50, 140 50, 150 30 Z" fill="#D4AF37" />
                        <path d="M 150 270 C 160 250, 170 250, 150 230 C 130 250, 140 250, 150 270 Z" fill="#D4AF37" />
                        <path d="M 30 150 C 50 140, 50 130, 70 150 C 50 170, 50 160, 30 150 Z" fill="#D4AF37" />
                        <path d="M 270 150 C 250 140, 250 130, 230 150 C 250 170, 250 160, 270 150 Z" fill="#D4AF37" />
                        <!-- Diagonal Petals -->
                        <path d="M 65 65 C 80 75, 90 65, 90 90 C 75 80, 65 90, 65 65 Z" fill="#73000A" />
                        <path d="M 235 235 C 220 225, 210 235, 210 210 C 225 220, 235 210, 235 235 Z" fill="#73000A" />
                        <path d="M 235 65 C 220 75, 210 65, 210 90 C 225 80, 235 90, 235 65 Z" fill="#73000A" />
                        <path d="M 65 235 C 80 225, 90 235, 90 210 C 75 220, 65 210, 65 235 Z" fill="#73000A" />
                    </g>
                    
                    <!-- Inner Rotating Ring -->
                    <g class="animate-spin-reverse">
                        <circle cx="150" cy="150" r="75" fill="none" stroke="#BF5700" stroke-width="3" stroke-dasharray="15, 15" />
                        <circle cx="150" cy="150" r="65" fill="#FDFBF7" stroke="#D4AF37" stroke-width="2" />
                    </g>

                    <!-- Central Pulsing Lone Star (Texas) -->
                    <g class="animate-pulse-glow">
                        <polygon points="150,95 163,130 200,130 170,152 182,190 150,168 118,190 130,152 100,130 137,130" fill="#BF5700" />
                        <!-- Star Inner detail -->
                        <polygon points="150,110 157,135 180,135 162,150 168,175 150,160 132,175 138,150 120,135 143,135" fill="#FF9933" opacity="0.8"/>
                    </g>
                </svg>